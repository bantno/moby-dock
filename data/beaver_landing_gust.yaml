# =============================================================================
# DHC-2 Beaver 6-DOF gusty approach: MIL-F-8785C discrete 1-cosine gust on
# final -- a 4.5 m/s tailwind shear plus a 2 m/s downdraft (both ramping over
# 120 m of penetration) hitting at t = 12 s, ~35 m AGL. Tail + sink is the
# unfavorable direction (energy loss on short final). The controller is
# wind-blind. See beaver_landing_calm.yaml for the plant/validation notes.
# =============================================================================

plant: beaver
V_app: 40.0
gamma_app_deg: -3.5

beaver:
  n_rpm: 1800.0

dt: 0.01
t_max: 120.0

initial:
  h0: 60.0

wind:
  enabled: true
  t_start: 12.0
  u_amp: 4.5    # tailwind [m/s]
  u_len: 120.0
  w_amp: -2.0   # downdraft [m/s]
  w_len: 120.0

hull:
  n_surfaces: 2
