# =============================================================================
# DHC-2 Beaver corridor landing -- NOMINAL-FAILURE CASE: short lake, hot approach
#
# A 500 m corridor (aim 100 m inside the near edge) and a 46 m/s approach
# speed: the water run from 46 m/s is ~460 m, the far edge is 400 m past the
# aim point. The nominal touches down on speed and overruns into the far shore.
#
# Barrier row that must flip this case: Phase 3 energy CEILING to the far edge minus the stopping run (throttle to
# idle, AoA up, S-turn); Phase 4 impact row for the resulting flare.
# Base: beaver_corridor_overhead.yaml (overhead entry, opposite heading).
# Nominal-only outcome is pinned by test_sixdof_sim.cpp [corridor][baseline]
# so the CBF phases have a ground truth to flip.
# =============================================================================

plant: beaver
V_app: 40.0
gamma_app_deg: -3.5

beaver:
  n_rpm: 1800.0
  pz_idle: 5.0
  pz_max: 26.0
  flap_deg: 0.0

dt: 0.01
t_max: 300.0

initial:
  h0: 250.0
  N0: 0.0
  E0: 0.0
  psi_deg: 180.0

nominal:
  phi_max_deg: 25.0
  V_ref: 46.0          # HOT approach (LR-556 band is 30-55 m/s)

hull:
  n_surfaces: 2

world:
  enabled: true
  corridor:
    center_N: 0.0
    center_E: 0.0
    length: 500.0        # SHORT: stopping run does not fit at 46 m/s
    width: 80.0
    heading_deg: 0.0     # land toward north
    aim_s: -150.0        # aim point 100 m inside the near edge
  terrain:
    base: 0.0
    bumps:
      - {name: mountain, N: 3000.0, E: 900.0, height: 250.0, sigma_a: 400.0, sigma_b: 250.0, rot_deg: 30.0, order: 1}
      - {name: house_a,  N: -800.0, E: 250.0, height: 8.0,   sigma_a: 6.0,   sigma_b: 6.0,   order: 2}
      - {name: far_shore_trees, N: 330.0, E: 0.0, height: 15.0, sigma_a: 30.0, sigma_b: 120.0, rot_deg: 0.0, order: 2}
      - {name: house_b,  N: -900.0, E: -300.0, height: 8.0,  sigma_a: 6.0,   sigma_b: 10.0,  rot_deg: 45.0, order: 2}
    rings:
      - {name: shore_trees, center_N: 0.0, center_E: 0.0, radius: 600.0, count: 48, height: 15.0, sigma: 25.0, order: 2}
  rollout:
    enabled: true
    a0: 0.8              # PLACEHOLDER hydrodynamic decel [m/s^2]
    kq: 0.002            # PLACEHOLDER quadratic drag [1/m]
    k_psi: 0.5
    V_stop: 0.5
    t_max: 90.0
