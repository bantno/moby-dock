# =============================================================================
# DHC-2 Beaver corridor landing -- NOMINAL-FAILURE CASE: slow approach at the AoA limit
#
# Starts at 36 m/s (trim alpha ~11.5 deg, inside the trusted band) with the
# nominal told to fly the approach at 31 m/s: the speed loop decelerates and
# the Beaver trims past 15 deg AoA on the way, into the stall (~16 deg; the
# LR-556 fit is trusted to ~12-13). The nominal flies it regardless.
#
# Barrier row that must flip this case: Phase 1 AoA ceiling (hard, 13 deg): the row holds alpha while the
# nominal keeps trying to slow down -- envelope kept, corridor not guaranteed
# (that is Phase 3's job).
# Base: beaver_corridor_overhead.yaml (overhead entry, opposite heading).
# Nominal-only outcome is pinned by test_sixdof_sim.cpp [corridor][baseline]
# so the CBF phases have a ground truth to flip.
# =============================================================================

plant: beaver
V_app: 36.0          # start inside the band ...
gamma_app_deg: -3.5

beaver:
  n_rpm: 1800.0
  pz_idle: 5.0
  pz_max: 26.0
  flap_deg: 0.0

dt: 0.01
t_max: 300.0

initial:
  h0: 250.0
  N0: 0.0
  E0: 0.0
  psi_deg: 180.0

nominal:
  phi_max_deg: 25.0
  V_ref: 31.0          # ... and decelerate into the stall

hull:
  n_surfaces: 2

world:
  enabled: true
  corridor:
    center_N: 0.0
    center_E: 0.0
    length: 700.0        # touchdown + stopping run
    width: 80.0
    heading_deg: 0.0     # land toward north
    aim_s: -200.0        # aim point 150 m inside the near edge
  terrain:
    base: 0.0
    bumps:
      - {name: mountain, N: 3000.0, E: 900.0, height: 250.0, sigma_a: 400.0, sigma_b: 250.0, rot_deg: 30.0, order: 1}
      - {name: house_a,  N: -800.0, E: 250.0, height: 8.0,   sigma_a: 6.0,   sigma_b: 6.0,   order: 2}
      - {name: house_b,  N: -900.0, E: -300.0, height: 8.0,  sigma_a: 6.0,   sigma_b: 10.0,  rot_deg: 45.0, order: 2}
    rings:
      - {name: shore_trees, center_N: 0.0, center_E: 0.0, radius: 600.0, count: 48, height: 15.0, sigma: 25.0, order: 2}
  rollout:
    enabled: true
    a0: 0.8              # PLACEHOLDER hydrodynamic decel [m/s^2]
    kq: 0.002            # PLACEHOLDER quadratic drag [1/m]
    k_psi: 0.5
    V_stop: 0.5
    t_max: 90.0
