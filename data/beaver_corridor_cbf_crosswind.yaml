# =============================================================================
# DHC-2 Beaver corridor landing, overhead entry + 5 m/s crosswind.
#
# Start over the lake center at 250 m, heading SOUTH (opposite the corridor
# heading), at approach speed. The pattern guidance plans a Dubins CSC path
# to a final-approach fix on the corridor axis south of the lake, sized so
# the whole pattern descends near gamma_app, then tracks it with L1 course
# tracking (bank) and the glideslope cone (gamma_ref). Touchdown is inside
# the corridor at glideslope sink (no flare yet), then the water rollout
# runs to a stop. Terrain: a shore ring of 15 m trees at 600 m, two houses
# near the final, a 250 m mountain to the north-east. Nothing guards the
# terrain yet -- the geometry is chosen so this nominal clears it; the CBF
# rows (Phase 1+) make that a guarantee. Same as beaver_corridor_overhead
# with a plant-side 5 m/s steady east wind (step gust, len 0) from t = 0:
# the guidance tracks the ground course so the crab is automatic. NOTE the
# wind steps in between the first two samples, so the trim is not in
# equilibrium with it and the first ~3 s are a gust response (beta ~ 6 deg),
# not a steady-wind approach -- an idealization, stated as such. The Dubins
# plan is ground-frame with a fixed radius; in wind the bank on an arc varies
# with ground speed (no wind-aware planning yet).
# =============================================================================

plant: beaver
V_app: 40.0
gamma_app_deg: -3.5

beaver:
  n_rpm: 1800.0
  pz_idle: 5.0
  pz_max: 26.0
  flap_deg: 0.0

dt: 0.01
t_max: 300.0

initial:
  h0: 250.0
  N0: 0.0
  E0: 0.0
  psi_deg: 180.0

wind:
  enabled: true
  t_start: 0.0
  v_amp: 5.0
  v_len: 0.0

nominal:
  phi_max_deg: 25.0

hull:
  n_surfaces: 2

world:
  enabled: true
  corridor:
    center_N: 0.0
    center_E: 0.0
    length: 700.0        # touchdown + stopping run
    width: 80.0
    heading_deg: 0.0     # land toward north
    aim_s: -200.0        # aim point 150 m inside the near edge
  terrain:
    base: 0.0
    bumps:
      - {name: mountain, N: 3000.0, E: 900.0, height: 250.0, sigma_a: 400.0, sigma_b: 250.0, rot_deg: 30.0, order: 1}
      - {name: house_a,  N: -800.0, E: 250.0, height: 8.0,   sigma_a: 6.0,   sigma_b: 6.0,   order: 2}
      - {name: house_b,  N: -900.0, E: -300.0, height: 8.0,  sigma_a: 6.0,   sigma_b: 10.0,  rot_deg: 45.0, order: 2}
    rings:
      - {name: shore_trees, center_N: 0.0, center_E: 0.0, radius: 600.0, count: 48, height: 15.0, sigma: 25.0, order: 2}
  rollout:
    enabled: true
    a0: 0.8              # PLACEHOLDER hydrodynamic decel [m/s^2]
    kq: 0.002            # PLACEHOLDER quadratic drag [1/m]
    k_psi: 0.5
    V_stop: 0.5
    t_max: 90.0

# 6-DOF surfaces-only CBF with the envelope rows soft and limits above the
# nominal's clamps: on a well-flown pattern it must stay quiet (A/B twin:
# filter: false logs the same barriers without intervening).
sixdof_cbf:
  enabled: true
  filter: true
  alpha_max_deg: 13.0
  phi_max_deg: 30.0
  beta_max_deg: 12.0
  V_min: 30.0
  V_max: 55.0
