# =============================================================================
# DHC-2 Beaver corridor landing, straight-in regression case.
#
# The corridor-landing world (world:) with the aircraft starting ON the
# extended corridor axis, 3 km before the aim point at glideslope altitude.
# The planner takes its DIRECT-line candidate (the aircraft is on the axis
# ahead of the FAF; a pure Dubins CSC plan is discontinuous here -- the trim
# sideslip alone offsets the initial ground course by 0.8 deg and the
# same-sense words then wrap a full circle), so this case reproduces the
# legacy calm straight-in (beaver_landing_calm.yaml) through the guidance +
# rollout path -- the regression anchor for the corridor scenarios. Terrain
# is defined (same world as the overhead demo) but nothing lies under a
# straight-in from the south except the shore ring.
# =============================================================================

plant: beaver
V_app: 40.0
gamma_app_deg: -3.5

beaver:
  n_rpm: 1800.0
  pz_idle: 5.0
  pz_max: 26.0
  flap_deg: 0.0

dt: 0.01
t_max: 200.0

# Absolute placement (world.enabled): 3 km short of the aim point (s_aim =
# -200 -> N = -3200), on the axis, heading north, at 3000 tan(3.5 deg) m.
initial:
  h0: 183.5
  N0: -3200.0
  E0: 0.0
  psi_deg: 0.0

nominal:
  phi_max_deg: 25.0

hull:
  n_surfaces: 2

world:
  enabled: true
  corridor:
    center_N: 0.0
    center_E: 0.0
    length: 700.0        # touchdown + stopping run
    width: 80.0
    heading_deg: 0.0     # land toward north
    aim_s: -200.0        # aim point 150 m inside the near edge
  terrain:
    base: 0.0
    bumps:
      - {name: mountain, N: 3000.0, E: 900.0, height: 250.0, sigma_a: 400.0, sigma_b: 250.0, rot_deg: 30.0, order: 1}
      - {name: house_a,  N: -800.0, E: 250.0, height: 8.0,   sigma_a: 6.0,   sigma_b: 6.0,   order: 2}
      - {name: house_b,  N: -900.0, E: -300.0, height: 8.0,  sigma_a: 6.0,   sigma_b: 10.0,  rot_deg: 45.0, order: 2}
    rings:
      - {name: shore_trees, center_N: 0.0, center_E: 0.0, radius: 600.0, count: 48, height: 15.0, sigma: 25.0, order: 2}
  rollout:
    enabled: true
    a0: 0.8              # PLACEHOLDER hydrodynamic decel [m/s^2]
    kq: 0.002            # PLACEHOLDER quadratic drag [1/m]
    k_psi: 0.5
    V_stop: 0.5
    t_max: 90.0
