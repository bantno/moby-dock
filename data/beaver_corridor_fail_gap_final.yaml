# =============================================================================
# DHC-2 Beaver corridor landing -- NOMINAL-FAILURE CASE: two mountains on the final with a gap
#
# The straight-in final crosses a ridge 1.0 km short of the aim point: two
# 350 m mountains whose flanks meet in a gap 150 m EAST of the corridor axis
# (gap floor ~43 m; the 3.5 deg glideslope is ~61 m up there). The axis
# itself runs into the western mountain's flank (224 m high at E = 0). The
# terrain-blind nominal flies the axis into it.
#
# Barrier row that must flip this case: Phase 2 terrain-clearance row (RD 3,
# hard) on the 6-DOF plant -- climbing over is not an option (the flank is
# too tall for the airspeed / AoA rows), so the row has to STEER the aircraft
# sideways through the gap, then the tracker returns it to the axis.
# Base: beaver_corridor_straight.yaml.
# =============================================================================

plant: beaver
V_app: 40.0
gamma_app_deg: -3.5

beaver:
  n_rpm: 1800.0
  pz_idle: 5.0
  pz_max: 26.0
  flap_deg: 0.0

dt: 0.01
t_max: 240.0

# Absolute placement (world.enabled): 3 km short of the aim point (s_aim =
# -200 -> N = -3200), on the axis, heading north, at 3000 tan(3.5 deg) m.
initial:
  h0: 183.5
  N0: -3200.0
  E0: 0.0
  psi_deg: 0.0

nominal:
  phi_max_deg: 25.0

hull:
  n_surfaces: 2

world:
  enabled: true
  corridor:
    center_N: 0.0
    center_E: 0.0
    length: 700.0        # touchdown + stopping run
    width: 80.0
    heading_deg: 0.0     # land toward north
    aim_s: -200.0        # aim point 150 m inside the near edge
  terrain:
    base: 0.0
    bumps:
      - {name: mountain, N: 3000.0, E: 900.0, height: 250.0, sigma_a: 400.0, sigma_b: 250.0, rot_deg: 30.0, order: 1}
      - {name: house_a,  N: -800.0, E: 250.0, height: 8.0,   sigma_a: 6.0,   sigma_b: 6.0,   order: 2}
      - {name: gap_west, N: -1200.0, E: -100.0, height: 350.0, sigma_a: 120.0, sigma_b: 150.0, rot_deg: 0.0, order: 1}
      - {name: gap_east, N: -1200.0, E: 400.0,  height: 350.0, sigma_a: 120.0, sigma_b: 150.0, rot_deg: 0.0, order: 1}
      - {name: house_b,  N: -900.0, E: -300.0, height: 8.0,  sigma_a: 6.0,   sigma_b: 10.0,  rot_deg: 45.0, order: 2}
    rings:
      - {name: shore_trees, center_N: 0.0, center_E: 0.0, radius: 600.0, count: 48, height: 15.0, sigma: 25.0, order: 2}
  rollout:
    enabled: true
    a0: 0.8              # PLACEHOLDER hydrodynamic decel [m/s^2]
    kq: 0.002            # PLACEHOLDER quadratic drag [1/m]
    k_psi: 0.5
    V_stop: 0.5
    t_max: 90.0
