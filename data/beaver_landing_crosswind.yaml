# =============================================================================
# DHC-2 Beaver 6-DOF crosswind water landing: the calm scenario with a steady
# 5 m/s crosswind from the left (step "gust", v_len: 0) starting at t = 5 s.
# The controller is wind-blind: it holds the centerline with bank while the
# nose crabs into the wind (no decrab yet). See beaver_landing_calm.yaml for
# the plant/validation notes.
# =============================================================================

plant: beaver
V_app: 40.0
gamma_app_deg: -3.5

beaver:
  n_rpm: 1800.0

dt: 0.01
t_max: 120.0

initial:
  h0: 60.0

wind:
  enabled: true
  t_start: 5.0
  v_amp: 5.0   # +y (east); a step => steady crosswind
  v_len: 0.0

hull:
  n_surfaces: 2
